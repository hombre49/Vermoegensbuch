name: Goldpreise

# Läuft jeden Morgen und lässt sich unter "Actions" auch von Hand starten ("Run workflow").
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser einrichten
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Preise von gold.de holen
        run: python werkzeug/goldpreise.py
      - name: Ergebnis ablegen
        if: always()
        run: |
          git config user.name "Goldpreise"
          git config user.email "actions@users.noreply.github.com"
          git add preise.json
          git add werkzeug/protokoll.txt || true
          git diff --cached --quiet || git commit -m "Goldpreise aktualisiert"
          git push
